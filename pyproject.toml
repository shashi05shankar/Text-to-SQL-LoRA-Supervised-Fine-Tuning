[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql-lora"
version = "0.1.0"
description = "LoRA supervised fine-tuning of Qwen2.5-1.5B-Instruct for text-to-SQL, measured by execution accuracy on Spider's held-out cross-domain dev set."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The local install is CPU-only: data prep, the eval harness, and serving. Training
# dependencies (torch/transformers/peft/bitsandbytes) live in the `train` extra and are
# installed by the Kaggle notebook, not here.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "requests>=2.31",
    "huggingface-hub>=0.23",
    # Chat templates are Jinja; `apply_chat_template` needs it even in tokenizer-only mode.
    "jinja2>=3.1",
    # A real SQL parser for the structural metrics. Regexes cannot tell that `T1.name`,
    # `singer.name` and `name` may be the same column, or that a double-quoted token is a
    # SQLite string literal rather than an identifier.
    "sqlglot>=25.0",
]

[project.optional-dependencies]
# Loading base model + LoRA adapter for CPU inference, and the API.
serve = [
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.12",
    "accelerate>=0.33",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
ui = [
    "streamlit>=1.33",
    "requests>=2.31",
    "matplotlib>=3.8",
]
# Installed on the GPU host (Kaggle), never locally.
train = [
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.12",
    "accelerate>=0.33",
    "bitsandbytes>=0.43",
    "datasets>=2.20",
]
dev = [
    "pytest>=8.1",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# The Kaggle notebook uses `!pip` magics and imports mid-file after the install cell.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["text2sql_lora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast, pure-logic tests; no dataset, no artifacts, no model download",
    "integration: needs the real Spider download in data/ or artifacts/ from a training run",
]
